# mac-display-remote 可选加固:nginx 反向代理 + 限流(不使用也完全可用)
#
# 适用场景:云服务器已装 nginx,希望在公网入口前加一层限流,并避免
# 访问日志记录快捷指令下载 URL 里的 ?t=<token>。
#
# 启用步骤:
#   1) 云端 /etc/frp/frps.toml 把 proxyBindAddr 改为 "127.0.0.1"
#   2) Mac 端 ~/.config/frp/frpc.toml 把 remotePort 改为 18980,重启 frpc
#   3) 复制本文件到 /etc/nginx/conf.d/mac-display.conf
#   4) nginx -t && systemctl reload nginx
#   5) 安全组只需放行 47000 和 18977(18980 仅本机监听)
#
# 注意:server.py 生成 Siri 快捷指令时取自请求 Host 头,所以这里必须
# 把 Host 原样传成 "<公网IP>:18977",否则快捷指令里的地址会变成 127.0.0.1。

limit_req_zone $binary_remote_addr zone=mdr_limit:10m rate=60r/m;

# 用 $uri(不含查询串)记录路径,避免 ?t=<token> 进入访问日志
log_format mdr_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent $request_time';

server {
    listen 18977 default_server;
    server_name _;

    access_log /var/log/nginx/mac-display.access.log mdr_noquery;
    error_log  /var/log/nginx/mac-display.error.log warn;

    client_max_body_size 64k;

    location / {
        limit_req zone=mdr_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:18980;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
}
